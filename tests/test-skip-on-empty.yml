name: Test skip-on-empty behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Test User"
          git config user.email "test@example.com"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "true"
          skip-tag: "true"
          skip-commit: "true"
          skip-version-file: "true"
          tag-prefix: "v"
          fallback-version: "1.0.0"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false', got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped output is set to '$SKIPPED'"
