name: Test fallback-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a package.json
        run: |
          echo '{"version": "0.0.0"}' > package.json
          git add package.json
          git commit -m "feat: add initial feature" || true

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "false"
          fallback-version: "2.0.0"

      - name: Assert action ran (skipped or produced version)
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          if [ "$SKIPPED" != "true" ] && [ -z "$VERSION" ]; then
            echo "FAIL: expected either skipped=true or a version output"
            exit 1
          fi
          echo "PASS"
