name: Test fallback-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create a conventional commit
        run: |
          git config user.name "Test User"
          git config user.email "test@example.com"
          # Create a feat commit so the action has something to release
          echo "test-$(date +%s)" > test-file.txt
          git add test-file.txt
          git commit -m "feat: add test file for fallback version test"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-tag: "true"
          skip-commit: "true"
          skip-version-file: "true"
          fallback-version: "2.0.0"
          tag-prefix: "v"

      - name: Assert outputs are set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          if [ "$SKIPPED" = "true" ]; then
            echo "PASS: action was skipped (no releasable commits found)"
          else
            if [ -z "$VERSION" ]; then
              echo "FAIL: version output is empty when not skipped"
              exit 1
            fi
            echo "PASS: version output is '$VERSION'"
          fi
