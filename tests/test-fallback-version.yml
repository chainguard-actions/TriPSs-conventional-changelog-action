name: Test fallback-version and input-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create input changelog file
        run: |
          echo "# Previous Changelog" > /tmp/input-changelog.md
          echo "Some old content" >> /tmp/input-changelog.md

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-version: "1.0.0"
          input-file: /tmp/input-changelog.md
          skip-on-empty: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-version-file: "true"
          git-push: "false"
          output-file: "false"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: expected skipped output to be set"
            exit 1
          fi
          echo "PASS: skipped output is '$SKIPPED'"

      - name: Assert version output is set when not skipped
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          if [ "$SKIPPED" = "false" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: expected version output to be set when not skipped"
              exit 1
            fi
            echo "PASS: version is '$VERSION'"
          else
            echo "PASS: action was skipped (no conventional commits found)"
          fi
