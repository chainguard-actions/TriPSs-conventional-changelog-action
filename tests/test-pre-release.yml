name: Test pre-release version generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and create a conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a dummy file and commit it with a conventional commit message
          echo "pre-release test content" > test-prerelease-file.txt
          git add test-prerelease-file.txt
          git commit -m "feat: add feature for pre-release testing"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"
          pre-release: "true"
          pre-release-identifier: "rc"

      - name: Assert pre-release version contains identifier
        env:
          VERSION: ${{ steps.action.outputs.version }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "tag: $TAG"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: action was skipped but a conventional commit was present"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          # Pre-release version should contain the identifier
          if echo "$VERSION" | grep -q "rc"; then
            echo "PASS: pre-release identifier 'rc' found in version: $VERSION"
          else
            echo "FAIL: expected pre-release identifier 'rc' in version '$VERSION'"
            exit 1
          fi
