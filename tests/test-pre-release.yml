name: Test pre-release flag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git remote reachable inside Docker
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"
          pre-release: "true"
          pre-release-identifier: "rc"

      - name: Assert action did not fail (skipped or produced output)
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "tag: $TAG"
          if [ "$SKIPPED" = "true" ]; then
            echo "INFO: action was skipped (no conventional commits)"
          else
            if [ -z "$VERSION" ]; then
              echo "FAIL: expected version to be set when not skipped"
              exit 1
            fi
            echo "PASS: version is '$VERSION', tag is '$TAG'"
          fi
