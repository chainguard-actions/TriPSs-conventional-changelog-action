name: Test basic usage with fallback-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@test.com"
          git config user.name "Test User"

      - name: Create package.json
        run: |
          echo '{"version": "0.0.0"}' > package.json
          git add package.json
          git commit -m "feat: initial commit"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          fallback-version: "1.0.0"
          tag-prefix: "v"
          preset: "angular"

      - name: Assert skipped output exists
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: expected skipped output to be set"
            exit 1
          fi
          echo "PASS: skipped=$SKIPPED"

      - name: Assert version output exists
        env:
          VERSION: ${{ steps.action.outputs.version }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "version: $VERSION"
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" = "true" ]; then
            echo "PASS: action was skipped (no conventional commits found)"
          elif [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set when not skipped"
            exit 1
          else
            echo "PASS: version=$VERSION"
          fi
