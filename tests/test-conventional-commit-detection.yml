name: Test conventional commit detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and create a conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a dummy file and commit it with a conventional commit message
          echo "test content" > test-conventional-file.txt
          git add test-conventional-file.txt
          git commit -m "feat: add new feature for testing"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "changelog: $CHANGELOG"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: action was skipped but a conventional commit was present"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: version detected: $VERSION"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
          CLEAN_CHANGELOG: ${{ steps.action.outputs.clean_changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          echo "clean_changelog: $CLEAN_CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: expected changelog output to be non-empty"
            exit 1
          fi
          echo "PASS: changelog is present"

      - name: Assert tag output is set
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: expected tag output to be set"
            exit 1
          fi
          echo "PASS: tag is: $TAG"
