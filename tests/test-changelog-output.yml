name: Test changelog output generation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git remote reachable inside Docker
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"
          preset: "angular"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          echo "changelog length: ${#CHANGELOG}"
          if [ "$SKIPPED" = "true" ]; then
            echo "INFO: action was skipped (no conventional commits) - changelog is expected to be empty"
          else
            if [ -z "$CHANGELOG" ]; then
              echo "FAIL: expected changelog to be set when not skipped"
              exit 1
            fi
            echo "PASS: changelog is set"
            echo "changelog: $CHANGELOG"
          fi

      - name: Assert version output is set when not skipped
        env:
          VERSION: ${{ steps.action.outputs.version }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          if [ "$SKIPPED" = "false" ] && [ -z "$VERSION" ]; then
            echo "FAIL: expected version to be set when not skipped"
            exit 1
          fi
          echo "PASS"

      - name: Assert skipped output is a boolean string
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false' but got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped output is a valid boolean string"
