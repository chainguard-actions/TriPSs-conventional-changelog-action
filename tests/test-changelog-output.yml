name: Test changelog output content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up a git origin reachable inside the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a package.json for version bumping
        run: |
          echo '{"version": "0.0.0"}' > "$GITHUB_WORKSPACE/package.json"
          git add package.json
          git commit -m "feat: add awesome new feature"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-on-empty: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          fallback-version: "1.0.0"
          tag-prefix: "v"
          version-file: "./package.json"
          version-path: "version"
          output-file: "false"
          preset: "angular"

      - name: Assert changelog output is not empty
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: expected changelog output to be non-empty"
            exit 1
          fi
          echo "PASS: changelog is non-empty"

      - name: Assert clean_changelog output is set
        env:
          CLEAN_CHANGELOG: ${{ steps.action.outputs.clean_changelog }}
        run: |
          echo "clean_changelog: $CLEAN_CHANGELOG"
          if [ -z "$CLEAN_CHANGELOG" ]; then
            echo "FAIL: expected clean_changelog output to be non-empty"
            exit 1
          fi
          echo "PASS: clean_changelog is non-empty"

      - name: Assert tag prefix is applied
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: expected tag output to be set"
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            echo "FAIL: expected tag to start with 'v', got '$TAG'"
            exit 1
          fi
          echo "PASS: tag '$TAG' has correct 'v' prefix"
