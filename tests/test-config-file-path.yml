name: Test config-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create conventional changelog config
        run: |
          git config user.name "Test User"
          git config user.email "test@example.com"
          # Create a conventional changelog config file
          cat > changelog-config.js << 'EOF'
          'use strict';
          module.exports = {
            writerOpts: {
              groupBy: 'type',
              commitGroupsSort: 'title',
              commitsSort: ['scope', 'subject']
            }
          };
          EOF
          echo "test-$(date +%s)" > test-file5.txt
          git add test-file5.txt
          git commit -m "feat: add test file for config-file-path test"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-tag: "true"
          skip-commit: "true"
          skip-version-file: "true"
          config-file-path: "changelog-config.js"
          fallback-version: "1.0.0"
          tag-prefix: "v"

      - name: Assert action ran without error
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false', got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: action completed with skipped='$SKIPPED'"
