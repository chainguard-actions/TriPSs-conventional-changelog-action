name: Test config-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create conventional changelog config file
        run: |
          cat > /tmp/changelog-config.js << 'EOF'
          'use strict';
          module.exports = {
            writerOpts: {
              groupBy: 'type',
              commitGroupsSort: 'title',
              commitsSort: ['scope', 'subject'],
            }
          };
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-file-path: /tmp/changelog-config.js
          fallback-version: "1.0.0"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          git-push: "false"
          skip-on-empty: "false"

      - name: Show outputs
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "tag: $TAG"
          echo "PASS: action completed with config-file-path input"
