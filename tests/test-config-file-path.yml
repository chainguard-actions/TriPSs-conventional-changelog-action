name: Test config-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up a git origin reachable inside the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a package.json for version bumping
        run: |
          echo '{"version": "0.0.0"}' > "$GITHUB_WORKSPACE/package.json"
          git add package.json
          git commit -m "feat: add feature for config-file-path test"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-on-empty: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          fallback-version: "1.0.0"
          tag-prefix: "v"
          version-file: "./package.json"
          version-path: "version"
          output-file: "false"
          config-file-path: "./test-changelog.config.js"

      - name: Assert changelog output is not empty
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: expected changelog output to be non-empty when using config-file-path"
            exit 1
          fi
          echo "PASS: changelog is non-empty with custom config-file-path"

      - name: Assert skipped is false
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: expected action NOT to be skipped"
            exit 1
          fi
          echo "PASS: action was not skipped"
