name: Test pre-changelog-generation input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create pre-changelog-generation script
        run: |
          cat > /tmp/pre-changelog-generation.js << 'EOF'
          // Pre-changelog-generation script
          // This script runs before the changelog is generated
          console.log('Pre-changelog-generation script executed');
          module.exports = async (gitSemver) => {
            console.log('gitSemver:', JSON.stringify(gitSemver));
          };
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fallback-version: "1.0.0"
          pre-changelog-generation: /tmp/pre-changelog-generation.js
          skip-on-empty: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-version-file: "true"
          git-push: "false"
          output-file: "false"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: expected skipped output to be set"
            exit 1
          fi
          echo "PASS: skipped output is '$SKIPPED'"
