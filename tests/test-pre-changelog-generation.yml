name: Test pre-changelog-generation input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create pre-changelog-generation script
        run: |
          cat > /tmp/pre-changelog-generation.js << 'EOF'
          module.exports = async (version, previousTag, currentTag) => {
            console.log('Pre-changelog-generation hook called');
            console.log('version:', version);
            console.log('previousTag:', previousTag);
            console.log('currentTag:', currentTag);
          };
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pre-changelog-generation: /tmp/pre-changelog-generation.js
          fallback-version: "1.0.0"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          git-push: "false"
          skip-on-empty: "false"

      - name: Show outputs
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "PASS: action completed with pre-changelog-generation input"
