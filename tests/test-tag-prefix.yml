name: Test custom tag prefix
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      ENV: dont-use-git
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git with a conventional fix commit
        run: |
          git config user.email "test@test.com"
          git config user.name "Test User"
          git commit --allow-empty -m "fix: resolve critical bug"

      - id: action
        uses: .
        with:
          github-token: ""
          skip-git-pull: "true"
          git-push: "false"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          tag-prefix: "release-"
          fallback-version: "1.0.0"
        env:
          SKIPPED_COMMIT: "true"
          SKIPPED_TAG: "true"
          EXPECTED_NO_PUSH: "true"
          SKIPPED_PULL: "true"

      - name: Assert tag uses custom prefix
        env:
          ACTUAL: ${{ steps.action.outputs.tag }}
        run: |
          echo "actual tag: $ACTUAL"
          if [[ "$ACTUAL" != release-* ]]; then
            echo "FAIL: expected tag to start with 'release-' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: tag correctly uses custom prefix 'release-'"

      - name: Assert skipped is false
        env:
          ACTUAL: ${{ steps.action.outputs.skipped }}
        run: |
          echo "actual skipped: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected skipped='false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
