name: Test basic usage - skipped when no conventional commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a package.json with initial version
        run: |
          echo '{"version": "1.0.0"}' > package.json
          git add package.json
          git commit -m "chore: initial setup" || true

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "true"
          skip-commit: "true"
          skip-tag: "true"
          fallback-version: "1.0.0"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ]; then
            echo "FAIL: expected skipped to be 'true' when no conventional commits found"
            exit 1
          fi
          echo "PASS"
