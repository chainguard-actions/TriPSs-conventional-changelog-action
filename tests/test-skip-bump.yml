name: Test skip-bump prevents version bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Set up a git origin reachable inside the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a package.json and add a feat commit
        run: |
          echo '{"version": "2.3.4"}' > "$GITHUB_WORKSPACE/package.json"
          git add package.json
          git commit -m "feat: add feature that should not bump version"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-on-empty: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-version-file: "true"
          skip-bump: "true"
          fallback-version: "2.3.4"
          tag-prefix: "v"
          version-file: "./package.json"
          version-path: "version"
          output-file: "false"

      - name: Assert action was not skipped
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action was not skipped"

      - name: Assert package.json version was not changed
        run: |
          CURRENT_VERSION=$(node -e "const p = require('./package.json'); console.log(p.version);")
          echo "current version in package.json: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" != "2.3.4" ]; then
            echo "FAIL: expected package.json version to remain '2.3.4', got '$CURRENT_VERSION'"
            exit 1
          fi
          echo "PASS: package.json version was not bumped"
