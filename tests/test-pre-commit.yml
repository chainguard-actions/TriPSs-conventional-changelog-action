name: Test pre-commit script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create package.json and pre-commit script
        run: |
          echo '{"version": "1.0.0"}' > package.json
          cat > pre-commit.js << 'EOF'
          // Pre-commit script - runs before the release commit
          module.exports = async (tag, exec) => {
            console.log('Pre-commit script running for tag:', tag);
          };
          EOF
          git add package.json pre-commit.js
          git commit -m "chore: setup with pre-commit script" || true

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "true"
          pre-commit: "pre-commit.js"
          fallback-version: "1.0.0"

      - name: Assert action completed with pre-commit input
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          echo "PASS: action completed with pre-commit input"
