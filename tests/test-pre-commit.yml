name: Test pre-commit script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create pre-commit script
        run: |
          cat > /tmp/pre-commit.js << 'EOF'
          module.exports = async (tag, exec) => {
            console.log('Pre-commit hook called with tag:', tag);
          };
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "true"
          skip-commit: "true"
          skip-tag: "true"
          pre-commit: "/tmp/pre-commit.js"
          fallback-version: "1.0.0"
          tag-prefix: "v"
          preset: "angular"
          output-file: "CHANGELOG.md"

      - name: Assert action completed
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false', got '$SKIPPED'"
            exit 1
          fi
          echo "PASS"
