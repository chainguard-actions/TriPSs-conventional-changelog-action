name: Test pre-commit script usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config user.email "test@test.com"
          git config user.name "Test User"

      - name: Create pre-commit script
        run: |
          cat > /tmp/pre-commit.js << 'EOF'
          module.exports = async (tag, exec) => {
            console.log('Pre-commit hook called with tag:', tag)
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "true"
          skip-commit: "true"
          skip-tag: "true"
          fallback-version: "1.0.0"
          pre-commit: "/tmp/pre-commit.js"

      - name: Assert skipped output exists
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: skipped output should not be empty"
            exit 1
          fi
          echo "PASS: skipped output is '$SKIPPED'"
