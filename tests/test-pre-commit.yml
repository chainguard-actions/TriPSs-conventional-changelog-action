name: Test pre-commit script usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@test.com"
          git config user.name "Test User"

      - name: Create package.json
        run: |
          echo '{"version": "0.0.0"}' > package.json
          git add package.json
          git commit -m "feat: initial commit"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          fallback-version: "1.0.0"
          pre-commit: "${{ github.workspace }}/actions/hardened/TriPSs--conventional-changelog-action/v6.3.0/tests/fixtures/pre-commit.js"
          tag-prefix: "v"

      - name: Assert skipped output exists
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: expected skipped output to be set"
            exit 1
          fi
          echo "PASS: skipped=$SKIPPED"
