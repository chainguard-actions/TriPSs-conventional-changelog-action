name: Test pre-commit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create package.json and pre-commit script
        run: |
          echo '{"version": "0.0.0"}' > package.json
          cat > pre-commit.js << 'EOF'
          // pre-commit script - no-op for testing
          module.exports = async (tag, exec) => {
            console.log('pre-commit hook called with tag:', tag);
          };
          EOF
          git add package.json pre-commit.js
          git commit -m "feat: initial setup with pre-commit script" --allow-empty

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "false"
          fallback-version: "1.0.0"
          pre-commit: "./pre-commit.js"
          version-file: "./package.json"
          output-file: "CHANGELOG.md"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: skipped output should not be empty"
            exit 1
          fi
          echo "PASS: skipped=$SKIPPED"
