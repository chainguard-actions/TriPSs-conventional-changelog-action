name: Test pre-commit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config, pre-commit script, and a conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a pre-commit script that writes a marker file
          cat > pre-commit.js << 'EOF'
          const fs = require('fs');
          fs.writeFileSync('/tmp/pre-commit-ran.txt', 'pre-commit ran');
          console.log('pre-commit script executed');
          EOF
          # Create a conventional commit so the action has something to process
          echo "pre-commit test" > test-pre-commit.txt
          git add test-pre-commit.txt
          git commit -m "feat: add pre-commit test feature"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"
          pre-commit: "pre-commit.js"

      - name: Assert action ran with pre-commit
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "changelog: $CHANGELOG"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: action was skipped but a conventional commit was present"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: action ran with pre-commit input, version=$VERSION"
