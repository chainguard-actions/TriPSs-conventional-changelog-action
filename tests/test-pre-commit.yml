name: Test pre-commit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create pre-commit script
        run: |
          cat > /tmp/pre-commit.js << 'EOF'
          module.exports = async (tag, exec) => {
            console.log('Pre-commit hook called with tag:', tag);
          };
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pre-commit: /tmp/pre-commit.js
          fallback-version: "1.0.0"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          git-push: "false"
          skip-on-empty: "false"

      - name: Show outputs
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "PASS: action completed with pre-commit input"
