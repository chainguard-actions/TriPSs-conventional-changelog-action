name: Test pre-commit script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create pre-commit script
        run: |
          git config user.name "Test User"
          git config user.email "test@example.com"
          # Create a pre-commit script
          cat > pre-commit.js << 'EOF'
          // Pre-commit script - runs before the release commit
          console.log('Pre-commit script executed');
          EOF
          echo "test-$(date +%s)" > test-file3.txt
          git add test-file3.txt
          git commit -m "feat: add test file for pre-commit test"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-tag: "true"
          skip-commit: "true"
          skip-version-file: "true"
          pre-commit: "pre-commit.js"
          fallback-version: "1.0.0"
          tag-prefix: "v"

      - name: Assert action ran without error
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false', got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: action completed with skipped='$SKIPPED'"
