name: Test basic skip-on-empty behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "true"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "true" ] && [ "$SKIPPED" != "false" ]; then
            echo "FAIL: expected skipped to be 'true' or 'false', got: '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped output is a valid boolean: $SKIPPED"
