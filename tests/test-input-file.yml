name: Test input-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config, existing changelog, and a conventional commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create an existing changelog file to be used as input-file
          cat > EXISTING_CHANGELOG.md << 'EOF'
          # Changelog

          ## [0.9.0] - 2023-01-01
          ### Features
          - Previous release content
          EOF
          # Create a conventional commit so the action has something to process
          echo "input file test" > test-input-file.txt
          git add test-input-file.txt
          git commit -m "feat: add input file test feature"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-on-empty: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-tag: "true"
          output-file: "false"
          fallback-version: "1.0.0"
          input-file: "EXISTING_CHANGELOG.md"

      - name: Assert action ran with input-file
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          echo "changelog length: ${#CHANGELOG}"
          if [ "$SKIPPED" = "true" ]; then
            echo "FAIL: action was skipped but a conventional commit was present"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: action ran with input-file, version=$VERSION"
