name: Test input-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create an existing changelog file
        run: |
          echo "# Existing Changelog" > EXISTING_CHANGELOG.md
          echo "" >> EXISTING_CHANGELOG.md
          echo "## v0.9.0 (2023-01-01)" >> EXISTING_CHANGELOG.md
          echo "" >> EXISTING_CHANGELOG.md
          echo "* Previous release notes" >> EXISTING_CHANGELOG.md

      - name: Create a conventional commit
        run: |
          git commit --allow-empty -m "feat: add new feature for input-file test"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "false"
          fallback-version: "1.0.0"
          input-file: "EXISTING_CHANGELOG.md"
          output-file: "CHANGELOG-input-file.md"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: skipped output should not be empty"
            exit 1
          fi
          echo "PASS: skipped output is '$SKIPPED'"
