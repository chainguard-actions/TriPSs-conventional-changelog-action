name: Test input-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create package.json and existing changelog
        run: |
          echo '{"version": "1.0.0"}' > package.json
          echo "# Existing Changelog" > EXISTING_CHANGELOG.md
          echo "" >> EXISTING_CHANGELOG.md
          echo "## Old content" >> EXISTING_CHANGELOG.md
          git add package.json EXISTING_CHANGELOG.md
          git commit -m "chore: setup" || true

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "true"
          input-file: "EXISTING_CHANGELOG.md"
          output-file: "CHANGELOG.md"
          fallback-version: "1.0.0"

      - name: Assert action completed (skipped is acceptable since no feat/fix commits)
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          echo "PASS: action completed with input-file input"
