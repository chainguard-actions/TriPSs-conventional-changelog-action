name: Test fallback-version and input-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create input changelog file
        run: |
          echo "# Previous Changelog" > /tmp/EXISTING_CHANGELOG.md
          echo "" >> /tmp/EXISTING_CHANGELOG.md
          echo "## Old release notes" >> /tmp/EXISTING_CHANGELOG.md

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          git-push: "false"
          skip-git-pull: "true"
          skip-commit: "true"
          skip-tag: "true"
          skip-on-empty: "false"
          fallback-version: "2.0.0"
          input-file: "/tmp/EXISTING_CHANGELOG.md"
          output-file: "CHANGELOG.md"
          tag-prefix: "v"
          preset: "angular"
          skip-version-file: "true"
          skip-ci: "false"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: expected skipped output to be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert version output is set when not skipped
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "skipped: $SKIPPED"
          echo "version: $VERSION"
          if [ "$SKIPPED" = "false" ] && [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set when not skipped"
            exit 1
          fi
          echo "PASS"
